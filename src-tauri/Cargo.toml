[package]
name = "rotellario"
version = "1.0.0"
description = "Rotellario — Dizionario della Lingua Rotellese"
authors = ["QTR Academy"]
edition = "2021"
rust-version = "1.77.2"

# Il nome della libreria: su mobile (iOS/Android) l'app parte da qui,
# non da main.rs. Per questo serve una crate-type con cdylib/staticlib.
[lib]
name = "rotellario_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
