<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f4e8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#04090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rotellario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f8f4e8;
  --bg2:      #f0ead6;
  --surface:  #fffef6;
  --border:   #c8a840;
  --border2:  #dfc060;
  --text:     #12100a;
  --text2:    #2a200a;
  --muted:    #6a5820;
  --muted2:   #9a8840;
  --gold:     #b8860a;
  --gold2:    #e0b01a;
  --gold3:    #f5d060;
  --goldfaint:rgba(200,148,10,0.14);
  --sap:      #0a3080;
  --sap2:     #1a52c0;
  --sap3:     #4a82e0;
  --sapfaint: rgba(10,48,128,0.10);
  --fs: 1rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:       #04090f;
    --bg2:      #070d18;
    --surface:  #0a1020;
    --border:   #3a2600;
    --border2:  #6a4800;
    --text:     #f0e8cc;
    --text2:    #d8c890;
    --muted:    #8a7040;
    --muted2:   #504020;
    --gold:     #e0b01a;
    --gold2:    #f5d060;
    --gold3:    #ffe898;
    --goldfaint:rgba(224,176,26,0.12);
    --sap:      #3070e0;
    --sap2:     #5898ff;
    --sap3:     #88bbff;
    --sapfaint: rgba(48,112,224,0.10);
  }
}

html { font-size: var(--fs); }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ── HEADER — nascosto allo scroll ──────────────────────────────────────── */
header {
  background: var(--sap);
  overflow: hidden;
  position: sticky; top: 0; z-index: 40;
  transition: transform 0.32s cubic-bezier(0.4,0,0.2,1),
              box-shadow 0.32s ease;
  box-shadow: 0 2px 24px rgba(0,0,0,0.35),
              0 0 40px rgba(26,82,192,0.25);
}
header.hidden {
  transform: translateY(-100%);
  box-shadow: none;
}
header::before {
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-conic-gradient(
    from 0deg at 50% 180%,
    rgba(224,176,26,0.08) 0deg 4deg,
    transparent 4deg 10deg);
}
header::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 2.5px;
  background: linear-gradient(90deg,
    transparent, var(--gold2) 20%, var(--gold3) 50%, var(--gold2) 80%, transparent);
  animation: shimmer 5s linear infinite;
  background-size: 200% 100%;
}
@keyframes shimmer { from{background-position:-200% 0} to{background-position:200% 0} }

.header-inner {
  position: relative; z-index: 1;
  padding: 1.2rem 1.2rem 1rem;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
}
.header-left h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.4rem; font-weight: 600; letter-spacing: 0.14em;
  color: var(--gold2);
  text-shadow: 0 0 30px rgba(224,176,26,0.5), 0 0 80px rgba(224,176,26,0.2);
  line-height: 1;
}
.header-sub {
  font-family: 'Outfit', sans-serif;
  font-size: 0.62rem; color: rgba(255,255,255,0.38);
  letter-spacing: 0.28em; text-transform: uppercase; margin-top: 0.4rem;
}
.header-count { font-size: 0.7rem; color: var(--gold); font-style: italic; margin-top: 0.18rem; font-family: 'Cormorant Garamond', serif; }
.header-badge {
  display: inline-block; margin-top: 0.5rem;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: #060200; font-family: 'Outfit', sans-serif; font-size: 0.54rem;
  font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
  padding: 0.18rem 0.65rem; border-radius: 2px;
}
.compass { flex-shrink: 0; animation: glow 3s ease-in-out infinite alternate; }
@keyframes glow {
  from { filter: drop-shadow(0 0 5px rgba(224,176,26,0.4)); }
  to   { filter: drop-shadow(0 0 14px rgba(224,176,26,0.9)); }
}

/* ── ORNAMENT BAR ── */
.ornament-bar {
  background: var(--sap); padding: 0.35rem 0; text-align: center;
  position: relative; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 39;
}
.ornament-bar::before, .ornament-bar::after {
  content: ''; position: absolute; top: 50%; width: 38%; height: 1px;
  transform: translateY(-50%);
}
.ornament-bar::before { left: 2%; background: linear-gradient(90deg, transparent, var(--gold)); }
.ornament-bar::after  { right: 2%; background: linear-gradient(90deg, var(--gold), transparent); }
.ornament-bar span {
  font-family: 'Cormorant Garamond', serif;
  color: var(--gold2); font-size: 0.75rem; letter-spacing: 0.5em;
  text-shadow: 0 0 10px rgba(224,176,26,0.7);
  position: relative; z-index: 1;
}

/* ── CONTROLS ── */
.controls {
  padding: 0.8rem 1.1rem 0.65rem;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 0.55rem;
  position: sticky; top: 0; z-index: 30;
}
.search-row { display: flex; gap: 0.45rem; }
input[type="text"], select {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text);
  font-family: 'Outfit', sans-serif; font-size: 0.88rem;
  padding: 0.48rem 0.78rem; outline: none; -webkit-appearance: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input[type="text"]:focus { border-color: var(--sap2); box-shadow: 0 0 0 2px var(--sapfaint); }
input[type="text"] { flex: 1; min-width: 0; }
select { min-width: 106px; }
.controls-row { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }

/* font size controls */
.font-controls {
  display: flex; align-items: center; gap: 0.3rem; margin-left: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
  padding: 0.2rem 0.4rem;
}
.font-controls span { font-size: 0.65rem; color: var(--muted); font-family: 'Outfit', sans-serif; letter-spacing: 0.05em; white-space: nowrap; }
.font-btn {
  background: transparent; border: none; cursor: pointer;
  color: var(--gold); font-size: 1rem; line-height: 1; padding: 0.1rem 0.25rem;
  font-weight: 600; border-radius: 4px; transition: background 0.15s;
}
.font-btn:active { background: var(--goldfaint); }

.view-toggle { display: flex; }
.view-toggle button:first-child { border-radius: 7px 0 0 7px; border-right: none; }
.view-toggle button:last-child  { border-radius: 0 7px 7px 0; }

/* ── BUTTONS ── */
.btn {
  border-radius: 7px; cursor: pointer; font-family: 'Outfit', sans-serif;
  border: 1px solid; padding: 0.44rem 0.88rem; font-size: 0.82rem;
  font-weight: 500; transition: all 0.15s; white-space: nowrap;
}
.btn-gold {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  border-color: var(--gold2); color: #080300; font-weight: 600;
  box-shadow: 0 2px 12px var(--goldfaint);
}
.btn-ghost { background: var(--surface); border-color: var(--border); color: var(--muted); }
.btn-active {
  background: linear-gradient(135deg, var(--sap), var(--sap2));
  border-color: var(--sap2); color: #fff; font-weight: 600;
  box-shadow: 0 2px 12px var(--sapfaint);
}
.btn-danger { background: transparent; border-color: #b91c1c; color: #ef4444; font-size: 0.72rem; padding: 0.26rem 0.52rem; }
.btn-sm { font-size: 0.72rem; padding: 0.26rem 0.52rem; background: transparent; border-color: var(--border); color: var(--muted); }

.result-count {
  font-size: 0.68rem; color: var(--muted2); font-family: 'Outfit', sans-serif;
  letter-spacing: 0.06em; padding: 0.28rem 1.2rem; background: var(--bg2);
}

/* ── MAIN ── */
main { padding: 1rem 1.1rem 3rem; max-width: 900px; margin: 0 auto; }

/* ── FORM BOX ── */
.form-box {
  background: var(--surface); border: 1px solid var(--gold2);
  border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 1.2rem;
  box-shadow: 0 4px 20px var(--goldfaint); position: relative; overflow: hidden;
}
.form-box::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2.5px;
  background: linear-gradient(90deg, var(--gold), var(--gold2), var(--gold3), var(--gold2), var(--gold));
}
.form-box h3 {
  font-family: 'Outfit', sans-serif; color: var(--gold); font-size: 0.75rem;
  font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
  margin-bottom: 0.8rem; padding-top: 0.2rem;
}
.form-fields { display: flex; flex-direction: column; gap: 0.48rem; }
.form-fields input, .form-fields select, .form-fields textarea { width: 100%; }
.form-fields textarea {
  background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
  color: var(--text); font-family: 'Outfit', sans-serif; font-size: 0.88rem;
  padding: 0.48rem 0.78rem; outline: none; resize: vertical; min-height: 70px;
}
.form-btns { display: flex; gap: 0.5rem; margin-top: 0.75rem; }

/* ── WORD LIST ── */
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 0.42rem; }
.alpha-section { margin-bottom: 1.5rem; }
.alpha-letter {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.9rem; font-weight: 600; letter-spacing: 0.08em;
  padding-bottom: 0.3rem; margin-bottom: 0.55rem;
  border-bottom: 1px solid var(--border);
  position: relative;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 6px rgba(224,176,26,0.4));
}
.alpha-letter::after {
  content: ''; position: absolute; bottom: -1px; left: 0; width: 2.8rem; height: 2px;
  background: linear-gradient(90deg, var(--gold2), transparent);
}
.alpha-words { display: flex; flex-wrap: wrap; gap: 0.35rem; }

/* ── WORD CARD ── */
.word-card {
  padding: 0.52rem 0.75rem; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
  display: flex; flex-direction: column; gap: 0.18rem;
  position: relative;
}
.word-card.compact { flex-direction: row; align-items: center; gap: 0.4rem; padding: 0.3rem 0.65rem; }
.word-card:active { opacity: 0.8; }
.word-card .wname {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  color: var(--text); font-size: 1rem; word-break: break-word; line-height: 1.3;
}
.word-card .wcat {
  font-family: 'Outfit', sans-serif; font-size: 0.58rem;
  letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.75; font-weight: 500;
}

/* ── INLINE DEFINITION PANEL ── */
.inline-def {
  margin-top: 0.3rem;
  border-radius: 0 0 8px 8px;
  border: 1px solid var(--border2);
  border-top: none;
  padding: 0.75rem 0.9rem 0.9rem;
  animation: defIn 0.18s ease;
  position: relative;
  overflow: hidden;
}
.inline-def::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--gold), var(--gold2), var(--gold));
}
@keyframes defIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }

.inline-def .def-text {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 0.95rem; line-height: 1.6; margin-bottom: 0.6rem;
}
.inline-def .def-text.empty { color: var(--muted2); font-size: 0.85rem; }
.inline-def .def-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }

/* card+def wrapper */
.card-wrap { margin-bottom: 0.42rem; }
.card-wrap .word-card { border-radius: 8px; margin-bottom: 0; }
.card-wrap.open .word-card { border-radius: 8px 8px 0 0; border-bottom-color: transparent; }

/* for grid: span full width when open */
.word-grid .card-wrap.open { grid-column: 1 / -1; }

.badge {
  font-family: 'Outfit', sans-serif; font-size: 0.56rem; border-radius: 4px;
  padding: 0.14rem 0.48rem; letter-spacing: 0.1em; text-transform: uppercase;
  border: 1px solid; display: inline-block; margin-left: 0.4rem;
  vertical-align: middle; font-weight: 600;
}

.empty { text-align: center; color: var(--muted2); padding: 3rem 1rem; font-style: italic; font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; }

/* ── FOOTER ── */
footer {
  padding: 1.3rem; text-align: center;
  font-family: 'Outfit', sans-serif; font-size: 0.6rem; color: var(--muted2);
  letter-spacing: 0.22em; text-transform: uppercase;
  border-top: 1px solid var(--border);
}
footer::before { content: '◆ ◇ ◆'; display: block; color: var(--gold); font-size: 0.6rem; letter-spacing: 0.5em; margin-bottom: 0.4rem; text-shadow: 0 0 8px rgba(224,176,26,0.7); }

/* gold corner */
.gold-corner { position: fixed; bottom: 0; right: 0; width: 90px; height: 90px; pointer-events: none; }
</style>
</head>

<div class="ornament-bar"><span>◆ ✦ ◆</span></div>

<div class="controls" id="controlsBar">

      <option value="tutte">Tutte</option>
      <option value="aggettivo">Aggettivo</option>
      <option value="sostantivo">Sostantivo</option>
      <option value="verbo">Verbo</option>
      <option value="locuzione">Locuzione</option>
      <option value="frase">Frase</option>
    </select>
  </div>
  <div class="controls-row">
    <div class="view-toggle">
      <button class="btn btn-active" id="btnGrid" onclick="setView('grid')">⊞ Griglia</button>
      <button class="btn btn-ghost" id="btnAlpha" onclick="setView('alpha')">Α Alfa</button>
    </div>
    <button class="btn btn-gold" onclick="openAdd()">＋ Aggiungi</button>
    <div class="font-controls">
      <span>Aa</span>
      <button class="font-btn" onclick="changeFontSize(-1)" title="Diminuisci">−</button>
      <button class="font-btn" onclick="changeFontSize(1)" title="Aumenta">＋</button>
    </div>
  </div>
</div>
<div class="result-count" id="resultCount"></div>

<main>
  <div id="addForm" style="display:none"></div>
  <div id="wordList"></div>
</main>

<footer>Rotellario · Prima Edizione · Lingua Rotellese</footer>

<script>
const STORAGE_KEY = "rotellario_v4";
const FS_KEY = "rotellario_fs";

// ── FONT SIZE ────────────────────────────────────────────────────────────────
let fontSize = parseFloat(localStorage.getItem(FS_KEY) || "16");
function applyFontSize() {
  document.documentElement.style.setProperty('--fs', fontSize + 'px');
  try { localStorage.setItem(FS_KEY, fontSize); } catch {}
}
function changeFontSize(delta) {
  fontSize = Math.min(24, Math.max(12, fontSize + delta));
  applyFontSize();
}
applyFontSize();

// ── HEADER HIDE ON SCROLL ───────────────────────────────────────────────────
let lastScroll = 0;
const header = document.getElementById('mainHeader');
window.addEventListener('scroll', () => {
  const cur = window.scrollY;
  if (cur > lastScroll && cur > 60) {
    header.classList.add('hidden');
  } else {
    header.classList.remove('hidden');
  }
  lastScroll = cur;
}, { passive: true });

const CAT = {
  aggettivo:  {light:{bg:"#f0ebff",text:"#5b21b6",border:"#a78bfa"},dark:{bg:"#160d30",text:"#c084fc",border:"#7c3aed"}},
  sostantivo: {light:{bg:"#ecfdf5",text:"#065f46",border:"#6ee7b7"},dark:{bg:"#052e1a",text:"#6ee7b7",border:"#059669"}},
  verbo:      {light:{bg:"#eff6ff",text:"#1e40af",border:"#93c5fd"},dark:{bg:"#071830",text:"#93c5fd",border:"#1d4ed8"}},
  locuzione:  {light:{bg:"#fff7ed",text:"#9a3412",border:"#fdba74"},dark:{bg:"#2a1005",text:"#fb923c",border:"#c2410c"}},
  frase:      {light:{bg:"#fefce8",text:"#854d0e",border:"#fde047"},dark:{bg:"#1c1500",text:"#fde047",border:"#a16207"}},
};
function isDark(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;}
function cc(cat){return(CAT[cat]||CAT.frase)[isDark()?'dark':'light'];}

let words=(()=>{try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):[...defaultWords];}catch{return[...defaultWords];}})();
let selectedId=null, currentView="grid";
let nextId=Math.max(...words.map(w=>w.id),0)+1;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(words));}catch{}}

function getFiltered(){
  const q=document.getElementById("searchInput").value.toLowerCase().trim();
  const cat=document.getElementById("catFilter").value;
  return words.filter(w=>(w.word.toLowerCase().includes(q)||w.def.toLowerCase().includes(q))&&(cat==="tutte"||w.cat===cat))
    .sort((a,b)=>a.word.localeCompare(b.word,"it"));
}

function setView(v){
  currentView=v;
  document.getElementById("btnGrid").className="btn "+(v==="grid"?"btn-active":"btn-ghost");
  document.getElementById("btnAlpha").className="btn "+(v==="alpha"?"btn-active":"btn-ghost");
  render();
}

function render(){
  const f=getFiltered();
  document.getElementById("totalCount").textContent=words.length+" lemmi catalogati";
  document.getElementById("resultCount").textContent=f.length+" risultati";
  renderList(f);
}

// ── INLINE PANEL ─────────────────────────────────────────────────────────────
function inlinePanel(w){
  const c=cc(w.cat);
  return `<div class="inline-def" style="background:${c.bg};border-color:${c.border}">
    <div style="margin-bottom:0.4rem">
      <span style="font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;color:${c.text}">${esc(w.word)}</span>
      <span class="badge" style="color:${c.text};border-color:${c.border}">${w.cat}</span>
    </div>
    <div class="def-text ${w.def?'':'empty'}" style="${w.def?'color:'+c.text:''}">
      ${w.def?esc(w.def):'Nessuna definizione ancora.'}
    </div>
    <div class="def-actions">
      <button class="btn btn-sm" onclick="openEdit(${w.id});event.stopPropagation()">✎ Modifica</button>
      <button class="btn btn-danger" onclick="deleteWord(${w.id});event.stopPropagation()">✕</button>
    </div>
  </div>`;
}

function renderList(f){
  const l=document.getElementById("wordList");
  if(!f.length){l.innerHTML='<div class="empty">Nessun lemma trovato.</div>';return;}

  if(currentView==="grid"){
    const items=f.map(w=>{
      const c=cc(w.cat); const sel=selectedId===w.id;
      return `<div class="card-wrap ${sel?'open':''}" id="wrap-${w.id}">
        ${cardHTML(w,false,sel,c)}
        ${sel?inlinePanel(w):''}
      </div>`;
    });
    l.innerHTML=`<div class="word-grid">${items.join("")}</div>`;
  } else {
    const g={};
    f.forEach(w=>{const k=w.word[0].toUpperCase();if(!g[k])g[k]=[];g[k].push(w);});
    l.innerHTML=Object.entries(g).sort(([a],[b])=>a.localeCompare(b))
      .map(([letter,ws])=>`
        <div class="alpha-section">
          <div class="alpha-letter">${letter}</div>
          <div class="alpha-words">
            ${ws.map(w=>{
              const c=cc(w.cat); const sel=selectedId===w.id;
              return `<div class="card-wrap ${sel?'open':''}" id="wrap-${w.id}" style="${sel?'width:100%':''}">
                ${cardHTML(w,true,sel,c)}
                ${sel?inlinePanel(w):''}
              </div>`;
            }).join("")}
          </div>
        </div>`).join("");
  }
}

function cardHTML(w,compact,sel,c){
  return `<div class="word-card ${compact?'compact':''}"
    style="${sel?'background:'+c.bg+';border-color:'+c.border+';':''}"
    onclick="selectWord(${w.id})"
    onmouseenter="if(!${sel}){this.style.borderColor='${c.border}';this.style.boxShadow='0 0 10px ${c.border}55';}"
    onmouseleave="if(!${sel}){this.style.borderColor='';this.style.boxShadow='';}">
    <span class="wname">${esc(w.word)}</span>
    <span class="wcat" style="color:${c.text}">${w.cat}</span>
  </div>`;
}

// ── ADD ───────────────────────────────────────────────────────────────────────
function openAdd(){
  document.getElementById("addForm").style.display="block";
  document.getElementById("addForm").innerHTML=`<div class="form-box"><h3>✦ Nuovo lemma</h3>
    <div class="form-fields">
      <input type="text" id="nw" placeholder="Parola *"/>
      <select id="nc">${["aggettivo","sostantivo","verbo","locuzione","frase"].map(c=>`<option value="${c}">${c[0].toUpperCase()+c.slice(1)}</option>`).join("")}</select>
      <textarea id="nd" placeholder="Definizione (opzionale)"></textarea>
    </div>
    <div class="form-btns">
      <button class="btn btn-gold" onclick="confirmAdd()">Aggiungi</button>
      <button class="btn btn-ghost" onclick="closeAdd()">Annulla</button>
    </div></div>`;
  setTimeout(()=>document.getElementById("nw").focus(),50);
}
function confirmAdd(){
  const word=document.getElementById("nw").value.trim();if(!word)return;
  words.push({id:nextId++,word,cat:document.getElementById("nc").value,def:document.getElementById("nd").value.trim()});
  save();closeAdd();render();
}
function closeAdd(){document.getElementById("addForm").style.display="none";document.getElementById("addForm").innerHTML="";}

// ── EDIT ──────────────────────────────────────────────────────────────────────
function openEdit(id){
  const w=words.find(x=>x.id===id);if(!w)return;
  const c=cc(w.cat);
  // replace inline panel with edit form in place
  const wrap=document.getElementById("wrap-"+id);
  if(!wrap)return;
  const existing=wrap.querySelector('.inline-def');
  if(existing) existing.outerHTML=`<div class="inline-def" style="background:${c.bg};border-color:${c.border}" id="edit-box-${id}">
    <div class="form-fields" style="gap:0.45rem">
      <input type="text" id="ew-${id}" value="${esc(w.word)}" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Outfit',sans-serif;font-size:0.88rem;padding:0.46rem 0.76rem;outline:none"/>
      <select id="ec-${id}" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Outfit',sans-serif;font-size:0.88rem;padding:0.46rem 0.76rem;outline:none;-webkit-appearance:none">${["aggettivo","sostantivo","verbo","locuzione","frase"].map(cat=>`<option value="${cat}"${w.cat===cat?" selected":""}>${cat[0].toUpperCase()+cat.slice(1)}</option>`).join("")}</select>
      <textarea id="ed-${id}" rows="3" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Outfit',sans-serif;font-size:0.88rem;padding:0.46rem 0.76rem;outline:none;resize:vertical">${esc(w.def)}</textarea>
    </div>
    <div class="form-btns" style="margin-top:0.6rem">
      <button class="btn btn-gold" onclick="confirmEdit(${id})">Salva</button>
      <button class="btn btn-ghost" onclick="render()">Annulla</button>
    </div>
  </div>`;
}
function confirmEdit(id){
  const i=words.findIndex(x=>x.id===id);if(i===-1)return;
  const ew=document.getElementById("ew-"+id);
  const ec=document.getElementById("ec-"+id);
  const ed=document.getElementById("ed-"+id);
  if(!ew||!ec||!ed)return;
  words[i].word=ew.value.trim();
  words[i].cat=ec.value;
  words[i].def=ed.value.trim();
  save();render();
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function selectWord(id){
  selectedId=selectedId===id?null:id;
  render();
  // scroll selected card into view smoothly
  if(selectedId){
    setTimeout(()=>{
      const el=document.getElementById("wrap-"+id);
      if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"});
    },60);
  }
}
function deleteWord(id){
  if(!confirm("Eliminare questo lemma?"))return;
  words=words.filter(w=>w.id!==id);selectedId=null;save();render();
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

if(window.matchMedia)window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);
render();
</script>
